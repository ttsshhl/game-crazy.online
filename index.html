<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAYDROP — играй в браузере</title>
<meta name="description" content="Браузерные игры без установки. Сохранения, рекорды, вход через Яндекс.">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="top">
  <div class="top__in">
    <a class="logo" href="./index.html">PLAY<b>DROP</b></a>
    <input class="search" id="search" type="search" placeholder="Найти игру" aria-label="Поиск игры">
    <div id="account"></div>
  </div>
</header>

<main class="shell">
  <section class="continue is-hidden" id="continue">
    <div class="row">
      <h2 id="continueTitle">Продолжить</h2>
      <span id="continueMeta"></span>
    </div>
    <div class="shelf" id="continueShelf"></div>
    <p class="nudge is-hidden" id="guestNudge">
      Прогресс привязан к этому браузеру.
      <button class="link" id="nudgeLogin">Войдите</button>, чтобы играть с телефона и компьютера.
    </p>
  </section>

  <section class="hero" id="hero"></section>

  <div class="row"><h2 id="allTitle">Все игры</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
import { ensureSession, isNamed, canSignIn, signIn, signOut } from './assets/db.js';
import { loadLibrary, loadStreak, fmtDuration, fmtAgo, plural } from './assets/library.js';
import { loadGames, loc, t } from './assets/catalog.js';

const games = await loadGames();
const byId = Object.fromEntries(games.map(g => [g.id, g]));
const session = await ensureSession();
const named = isNamed(session);

// ─── аккаунт ─────────────────────────────────────────────────
document.getElementById('continueTitle').textContent = t.continue;
document.getElementById('allTitle').textContent = t.all;
document.getElementById('search').placeholder = t.search;

const box = document.getElementById('account');
if (named) {
  box.innerHTML = `<a class="acc" href="./profile.html">
      <img class="ava" src="${session.user.user_metadata?.avatar_url || ''}" alt="">
      <span>${session.user.user_metadata?.name || 'Профиль'}</span></a>
    <button class="btn btn--ghost" id="out">Выйти</button>`;
  document.getElementById('out').onclick = async () => { await signOut(); location.reload(); };
} else {
  box.innerHTML = `<a class="acc" href="./profile.html">${t.profile}</a>` +
    (canSignIn ? `<button class="btn" id="in">${t.signIn}</button>` : '');
  if (canSignIn) document.getElementById('in').onclick = () => signIn(location.href);
}

// ─── полка «Продолжить» ──────────────────────────────────────
const library = (await loadLibrary(session, games))
  .filter(e => byId[e.game_id] && e.last_played)
  .sort((a, b) => new Date(b.last_played) - new Date(a.last_played))
  .slice(0, 6);

if (library.length) {
  const streak = await loadStreak(session);
  document.getElementById('continue').classList.remove('is-hidden');
  document.getElementById('continueMeta').textContent = streak.current > 1
    ? `${streak.current} ${plural(streak.current, 'день', 'дня', 'дней')} подряд`
    : '';

  document.getElementById('continueShelf').innerHTML = library.map(e => {
    const g = byId[e.game_id];
    const place = e.rank ? `${e.rank}-е место из ${e.total_players}` : '';
    const time = e.seconds ? fmtDuration(e.seconds) : '';
    return `<a class="slot" href="./game.html?id=${g.id}">
      <img class="slot__img" src="${g.cover}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="slot__b">
        <h3>${loc(g).title}</h3>
        <p>${[fmtAgo(e.last_played), time].filter(Boolean).join(' · ')}</p>
        ${place ? `<p class="slot__rank">${place}</p>` : ''}
      </div>
      <span class="slot__go">Продолжить</span>
    </a>`;
  }).join('');

  if (!named && canSignIn) {
    const nudge = document.getElementById('guestNudge');
    nudge.classList.remove('is-hidden');
    document.getElementById('nudgeLogin').onclick = () => signIn(location.href);
  }
}

// ─── витрина ─────────────────────────────────────────────────
const played = new Set(library.map(e => e.game_id));
const featured = games.find(g => g.featured && !played.has(g.id))
  || games.find(g => !played.has(g.id)) || games[0];

document.getElementById('hero').innerHTML = `
  <a class="hero__main" href="./game.html?id=${featured.id}">
    <img src="${featured.cover}" alt="" onerror="this.style.display='none'">
    <div class="hero__grad"></div>
    <div class="hero__body">
      <div class="eyebrow">${played.size ? t.notPlayed : t.playingNow}</div>
      <h1>${loc(featured).title}</h1>
      <p>${loc(featured).description}</p>
      <span class="btn">${t.play}</span>
    </div>
  </a>
  <div class="hero__side">
    <div class="stat"><b>${games.length}</b><span>${t.games}</span></div>
    <div class="stat"><b>0 ₽</b><span>${t.free}</span></div>
  </div>`;

// ─── каталог ─────────────────────────────────────────────────
const grid = document.getElementById('grid');
function render(list) {
  document.getElementById('count').textContent = `${list.length} шт.`;
  grid.innerHTML = list.map(g => `
    <a class="card" href="./game.html?id=${g.id}">
      ${g.tag ? `<span class="tag">${g.tag}</span>` : ''}
      <img class="card__img" src="${g.cover}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="card__b"><h3>${loc(g).title}</h3><p>${loc(g).genre}</p></div>
    </a>`).join('');
}
render(games);

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  render(games.filter(g => (g.title + (g.title_en || '') + (g.genre || '')).toLowerCase().includes(q)));
});
</script>
</body>
</html>
