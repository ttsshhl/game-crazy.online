<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAYDROP</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#24262B">
<link rel="stylesheet" href="./assets/style.css">
<!-- РСЯ: раскомментировать после модерации сайта
<script>window.yaContextCb=window.yaContextCb||[]</script>
<script src="https://yandex.ru/ads/system/context.js" async></script>
-->
</head>
<body>

<header class="top">
  <div class="top__in">
    <a class="logo" href="./index.html">PLAY<b>DROP</b></a>
    <div id="account"></div>
  </div>
</header>

<main class="play">
  <div class="stage" id="stage">
    <iframe id="gameFrame"
            allow="autoplay; fullscreen; gamepad; pointer-lock; clipboard-write"
            allowfullscreen></iframe>

    <div class="loader" id="loader">
      <div class="eyebrow">Загрузка</div>
      <div class="loader__bar"><i></i></div>
    </div>

    <div class="adv is-hidden" id="adOverlay">
      <div class="adv__label" id="adLabel">Реклама</div>
      <div id="adSlot"></div>
      <div class="adv__timer" id="adTimer">5</div>
      <button class="btn btn--ghost is-hidden" id="adSkip">Пропустить без награды</button>
    </div>
  </div>

  <div class="playbar">
    <div>
      <h1 id="gameTitle">…</h1>
      <small id="gameDev"></small>
    </div>
    <button class="btn" id="fsBtn">На весь экран</button>
  </div>

  <div class="banner is-hidden" id="adBanner">Рекламный блок 728×90</div>
  <div class="banner is-hidden" id="reviewBox">Оцените игру — форма отзыва</div>
</main>

<script type="module" src="./assets/host.js"></script>
</body>
</html>
