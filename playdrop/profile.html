<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — PLAYDROP</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#24262B">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="top">
  <div class="top__in">
    <a class="logo" href="./index.html">PLAY<b>DROP</b></a>
    <div id="account"></div>
  </div>
</header>

<main class="shell">
  <section class="profile" id="profileHead"></section>

  <div class="row"><h2>Прогресс по играм</h2><span id="libCount"></span></div>
  <div class="progress-list" id="libList"></div>

  <section class="empty is-hidden" id="empty">
    <h2>Здесь появится ваш прогресс</h2>
    <p>Сыграйте в любую игру — время, рекорды и место в таблице будут копиться на этой странице.</p>
    <a class="btn" href="./index.html">Выбрать игру</a>
  </section>
</main>

<script type="module">
import { db, ensureSession, isNamed, canSignIn, signIn, signOut } from './assets/db.js';
import { loadLibrary, loadStreak, xpFrom, levelFrom, fmtDuration, fmtAgo, plural } from './assets/library.js';
import { loadGames, loc } from './assets/catalog.js';
import { lastError } from './assets/library.js';

const games = await loadGames();
const byId = Object.fromEntries(games.map(g => [g.id, g]));
const session = await ensureSession();
const named = isNamed(session);

const box = document.getElementById('account');
if (named) {
  box.innerHTML = `<button class="btn btn--ghost" id="out">Выйти</button>`;
  document.getElementById('out').onclick = async () => { await signOut(); location.href = './index.html'; };
} else if (canSignIn) {
  box.innerHTML = `<button class="btn" id="in">Войти</button>`;
  document.getElementById('in').onclick = () => signIn(location.href);
}

// панель загрузки — только для администратора
try {
  const { data: isAdmin } = await db.rpc('is_admin');
  if (isAdmin) {
    const a = document.createElement('a');
    a.className = 'btn btn--ghost'; a.href = './admin.html'; a.textContent = 'Загрузить игру';
    box.prepend(a);
  }
} catch (_) {}

const library = (await loadLibrary(session, games)).filter(e => byId[e.game_id]);
const streak = await loadStreak(session);

// свой профиль: имя и аватар хранятся в таблице profiles
let me = { name: null, photo: null };
try {
  const { data } = await db.rpc('my_profile');
  if (data && data[0]) me = data[0];
} catch (_) {}

const totalSeconds = library.reduce((s, e) => s + (e.seconds || 0), 0);
const xp = xpFrom(library);
const lvl = levelFrom(xp);

const user = named ? session.user : null;
const name = me.name || user?.user_metadata?.name || user?.user_metadata?.full_name || 'Гость';
const photo = me.photo || user?.user_metadata?.avatar_url || '';

document.getElementById('profileHead').innerHTML = `
  <div class="profile__id">
    <button class="profile__avaBtn" id="avaBtn" title="Сменить фото">
      ${photo ? `<img class="profile__ava" src="${photo}" alt="">` : `<div class="profile__ava profile__ava--empty">${name[0]}</div>`}
      <span class="profile__avaHint">Сменить</span>
    </button>
    <input type="file" id="avaFile" accept="image/*" hidden>
    <div>
      <div class="eyebrow">Уровень ${lvl.level}</div>
      <h1 id="nameField" contenteditable="plaintext-only" spellcheck="false">${name}</h1>
      <small class="saveHint is-hidden" id="saveHint">Сохранено</small>
      <div class="xp" role="img" aria-label="До следующего уровня ${lvl.need - lvl.into} очков">
        <i style="width:${lvl.percent}%"></i>
      </div>
      <small>${lvl.into} / ${lvl.need} XP до ${lvl.level + 1} уровня</small>
    </div>
  </div>
  <div class="profile__stats">
    <div class="stat"><b>${fmtDuration(totalSeconds)}</b><span>всего в играх</span></div>
    <div class="stat"><b>${library.length}</b><span>${plural(library.length, 'игра начата', 'игры начаты', 'игр начато')}</span></div>
    <div class="stat"><b>${streak.current}</b><span>${plural(streak.current, 'день', 'дня', 'дней')} подряд${streak.best > streak.current ? ` · рекорд ${streak.best}` : ''}</span></div>
  </div>
  ${!named && canSignIn ? `<p class="nudge">Гостевой профиль привязан к этому браузеру.
    <button class="link" id="upgrade">Войдите</button> — прогресс перенесётся, ничего не потеряется.</p>` : ''}`;

if (!named && canSignIn) document.getElementById('upgrade').onclick = () => signIn(location.href);

// ─── смена аватара ───────────────────────────────────────────
const avaFile = document.getElementById('avaFile');
document.getElementById('avaBtn').onclick = () => avaFile.click();

avaFile.onchange = async () => {
  const file = avaFile.files[0];
  if (!file || !session) return;
  if (file.size > 2 * 1024 * 1024) return flash('Файл больше 2 МБ');

  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${session.user.id}/avatar.${ext}`;
    const up = await db.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
    if (up.error) throw up.error;

    const url = db.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const { error } = await db.from('profiles').upsert({ id: session.user.id, photo: url, name: currentName() });
    if (error) throw error;

    const box2 = document.querySelector('.profile__avaBtn');
    box2.innerHTML = `<img class="profile__ava" src="${url}" alt=""><span class="profile__avaHint">Сменить</span>`;
    box2.onclick = () => avaFile.click();
    flash('Сохранено');
  } catch (e) {
    flash(e.message || 'Не удалось загрузить');
  }
};

// ─── смена имени ─────────────────────────────────────────────
const nameField = document.getElementById('nameField');
function currentName() { return (nameField.textContent || '').trim().slice(0, 40) || 'Игрок'; }

nameField.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameField.blur(); } });
nameField.addEventListener('blur', async () => {
  if (!session) return;
  const value = currentName();
  nameField.textContent = value;
  const { error } = await db.from('profiles').upsert({ id: session.user.id, name: value });
  flash(error ? (error.message || 'Не удалось сохранить') : 'Сохранено');
});

function flash(text) {
  const el = document.getElementById('saveHint');
  el.textContent = text;
  el.classList.remove('is-hidden');
  setTimeout(() => el.classList.add('is-hidden'), 2500);
}

if (!library.length) {
  document.getElementById('empty').classList.remove('is-hidden');
  if (lastError) {
    const p = document.createElement('p');
    p.className = 'nudge';
    p.textContent = 'Прогресс не удалось получить с сервера: ' + lastError;
    document.getElementById('empty').appendChild(p);
  }
} else {
  document.getElementById('libCount').textContent = `${library.length} ${plural(library.length, 'игра', 'игры', 'игр')}`;
  document.getElementById('libList').innerHTML = library
    .sort((a, b) => (b.seconds || 0) - (a.seconds || 0))
    .map(e => {
      const g = byId[e.game_id];
      const share = totalSeconds ? Math.max(3, Math.round((e.seconds / totalSeconds) * 100)) : 0;
      const top = e.rank && e.total_players
        ? `${e.rank}-е место из ${e.total_players}`
        : 'Рекорд ещё не отправлен';
      return `<a class="prow" href="./game.html?id=${g.id}">
        <img class="prow__img" src="${g.cover}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="prow__b">
          <h3>${loc(g).title}</h3>
          <div class="bar"><i style="width:${share}%"></i></div>
          <p>${fmtDuration(e.seconds)} · ${e.sessions || 1} ${plural(e.sessions || 1, 'запуск', 'запуска', 'запусков')} · ${fmtAgo(e.last_played)}</p>
        </div>
        <div class="prow__side">
          ${e.best_score != null ? `<b>${Number(e.best_score).toLocaleString('ru-RU')}</b>` : '<b>—</b>'}
          <span>${top}</span>
        </div>
      </a>`;
    }).join('');
}
</script>
</body>
</html>
